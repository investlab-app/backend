        sic_code:
          type: string
          nullable: true
          description: Standard Industrial Classification code.
          maxLength: 10
        sic_description:
          type: string
          nullable: true
          maxLength: 255
        total_employees:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        weighted_shares_outstanding:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        address:
          type: object
          properties:
            address1:
              type: string
              nullable: true
            address2:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
            state:
              type: string
              nullable: true
            postal_code:
              type: string
              nullable: true
          required:
          - address1
          - address2
