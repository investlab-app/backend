components:
  schemas:
    AccountValueOverTimeResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/AccountValueSnapshotDaily'
        current_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,28}(?:\.\d{0,2})?$
      required:
      - current_value
      - history
    AccountValueSnapshotDaily:
      type: object
      description: Serializer for AccountValueSnapshot model.
      properties:
        date:
          type: string
          format: date
          readOnly: true
          description: Date of the value measurement
        value:
          type: number
          format: double
          description: Account value on this date
      required:
      - date
      - value
    AllTickers:
      type: object
      properties:
        tickers:
          type: array
          items:
            type: string
      required:
      - tickers
    AssetAllocation:
      type: object
      properties:
        total_value:
          type: number
          format: double
        total_gain_this_year:
          type: number
          format: double
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AssetAllocationItem'
      required:
      - allocations
      - total_gain_this_year
      - total_value
    AssetAllocationItem:
      type: object
      properties:
        instrument_name:
          type: string
          maxLength: 255
        instrument_ticker:
          type: string
          maxLength: 20
        instrument_logo:
          type: string
          format: uri
          nullable: true
        instrument_icon:
          type: string
          format: uri
          nullable: true
        value:
          type: number
          format: double
        percentage:
          type: number
          format: double
      required:
      - instrument_icon
      - instrument_logo
      - instrument_name
      - instrument_ticker
      - percentage
      - value
    AuthTestResponse:
      type: object
      description: Serializer for authentication test response
      properties:
        message:
          type: string
          description: Authentication success message
        user_role:
          type: string
          description: Role of the authenticated user
        user_id:
          type: integer
          description: ID of the authenticated user
      required:
      - message
      - user_id
      - user_role
    Chat:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        message_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - message_count
      - title
      - updated_at
    ChatDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          readOnly: true
      required:
      - created_at
      - id
      - messages
      - title
      - updated_at
    ChatDetailRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - title
    ChatMessage:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          default: ''
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          default: user
        content:
          type: string
          readOnly: true
          default: ''
        createdAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - content
      - createdAt
      - id
      - role
    ClerkLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    CreateChatMessageRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: user
      required:
      - content
    CreateChatRequest:
      type: object
      properties:
        first_message:
          type: string
          minLength: 1
          maxLength: 10000
      required:
      - first_message
    CreateLimitOrderRequest:
      type: object
      properties:
        ticker:
          type: string
          writeOnly: true
          minLength: 1
        volume:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,5})?$
          writeOnly: true
        is_buy:
          type: boolean
          writeOnly: true
        limit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,22}(?:\.\d{0,8})?$
          writeOnly: true
      required:
      - is_buy
      - limit_price
      - ticker
      - volume
    CreateMarketOrderRequest:
      type: object
      properties:
        ticker:
          type: string
          writeOnly: true
          minLength: 1
        volume:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,5})?$
          writeOnly: true
        is_buy:
          type: boolean
          writeOnly: true
      required:
      - is_buy
      - ticker
      - volume
    CurrentAccountValue:
      type: object
      properties:
        total_account_value:
          type: number
          format: double
        gain:
          type: number
          format: double
        gain_percentage:
          type: number
          format: double
          nullable: true
      required:
      - gain
      - gain_percentage
      - total_account_value
    DepositHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,28}(?:\.\d{0,2})?$
          readOnly: true
          title: Deposit Amount
        deposited_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - deposited_at
      - id
    DepositMoney:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - amount
    DepositMoneyRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - amount
    FormatEnum:
      enum:
      - push
      - mail
      type: string
      description: |-
        * `push` - push
        * `mail` - mail
    Graph:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        raw_graph_data: {}
        active:
          type: boolean
        repeat:
          type: boolean
      required:
      - id
      - name
      - raw_graph_data
    GraphEffect:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          readOnly: true
        effect:
          allOf:
          - $ref: '#/components/schemas/GraphEffectDetail'
          readOnly: true
        success:
          type: boolean
      required:
      - created_at
      - effect
      - success
    GraphEffectDetail:
      oneOf:
      - $ref: '#/components/schemas/GraphTransactionEffect'
      - $ref: '#/components/schemas/GraphNotificationEffect'
      discriminator:
        propertyName: effect_type
        mapping:
          transaction: '#/components/schemas/GraphTransactionEffect'
          notification: '#/components/schemas/GraphNotificationEffect'
    GraphNotificationEffect:
      type: object
      properties:
        message:
          type: string
        format:
          $ref: '#/components/schemas/FormatEnum'
        effect_type:
          type: string
          readOnly: true
      required:
      - effect_type
      - format
      - message
    GraphRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        raw_graph_data: {}
        active:
          type: boolean
        repeat:
          type: boolean
      required:
      - name
      - raw_graph_data
    GraphResult:
      type: object
      properties:
        action: {}
      required:
      - action
    GraphTransactionEffect:
      type: object
      properties:
        instrument:
          $ref: '#/components/schemas/InstrumentName'
        is_buy:
          type: boolean
        amount:
          type: number
          format: double
        action_price:
          type: number
          format: double
        effect_type:
          type: string
          readOnly: true
      required:
      - action_price
      - amount
      - effect_type
      - instrument
      - is_buy
    GraphUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        raw_graph_data: {}
        active:
          type: boolean
        repeat:
          type: boolean
    HistoryEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Date of the transaction
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,5})?$
          description: Number of shares traded
        final_transaction_value:
          type: number
          format: double
          description: Value of the transaction at closing or current market price
        final_share_price:
          type: number
          format: double
          description: Price per share at the time of sell transaction or current
            market price
        initial_share_price:
          type: number
          format: double
          description: Price per share at the time of buy transaction
        gain:
          type: number
          format: double
          description: Gain or loss from this transaction
        gain_percentage:
          type: number
          format: double
          description: Gain or loss percentage from this transaction
      required:
      - final_share_price
      - final_transaction_value
      - gain
      - gain_percentage
      - initial_share_price
      - quantity
      - timestamp
    Insight:
      type: object
      properties:
        sentiment:
          type: string
          nullable: true
        sentiment_reasoning:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
    InstrumentList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticker:
          type: string
          title: Ticker Symbol
          maxLength: 20
        type:
          type: string
          nullable: true
          description: Security type, e.g. 'CS' (Common Stock), 'ETF', 'Crypto'.
          maxLength: 50
        active:
          type: boolean
          description: Indicates whether the ticker is actively traded.
        name:
          type: string
          maxLength: 255
        market:
          $ref: '#/components/schemas/MarketEnum'
        market_cap:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          nullable: true
        currency_name:
          type: string
          maxLength: 50
        icon:
          type: string
          format: uri
          nullable: true
        logo:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - market
      - name
      - ticker
    InstrumentName:
      type: object
      properties:
        ticker:
          type: string
          title: Ticker Symbol
          maxLength: 20
      required:
      - ticker
    InstrumentRetrieve:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticker:
          type: string
          title: Ticker Symbol
          maxLength: 20
        type:
          type: string
          nullable: true
          description: Security type, e.g. 'CS' (Common Stock), 'ETF', 'Crypto'.
          maxLength: 50
        active:
          type: boolean
          description: Indicates whether the ticker is actively traded.
        name:
          type: string
          maxLength: 255
        cik:
          type: string
          nullable: true
          description: Central Index Key assigned by the SEC.
          maxLength: 20
        market:
          $ref: '#/components/schemas/MarketEnum'
        market_cap:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          nullable: true
        composite_figi:
          type: string
          nullable: true
          description: Composite Financial Instrument Global Identifier.
          maxLength: 20
        currency_name:
          type: string
          maxLength: 50
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          description: |-
            Locale where the ticker is traded, e.g. 'US'.

            * `us` - United States
            * `global` - Global
        primary_exchange:
          type: string
          nullable: true
          description: Code of the primary exchange where the ticker is traded.
          maxLength: 50
        share_class_figi:
          type: string
          nullable: true
          maxLength: 20
        description:
          type: string
          nullable: true
        ticker_root:
          type: string
          nullable: true
          description: Base symbol for related tickers.
          maxLength: 50
        ticker_suffix:
          type: string
          nullable: true
          description: Suffix for ticker if applicable.
          maxLength: 50
        homepage_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        list_date:
          type: string
          format: date
          nullable: true
          description: Date when the ticker was first listed.
        phone_number:
          type: string
          nullable: true
          maxLength: 30
        share_class_shares_outstanding:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          title: Shares Outstanding (Share Class)
