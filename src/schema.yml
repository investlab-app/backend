openapi: 3.0.3
info:
  title: Stocks API
  version: 0.0.1
  description: API for stock market data and trading operations
paths:
  /api/auth/sign-in/:
    post:
      operationId: auth_sign_in_create
      description: Authenticates a user using their email and password through Clerk,
        returning a sign-in token upon success.
      summary: Sign in a user with email and password via Clerk
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClerkLoginRequest'
        required: true
      security:
      - ClerkAuth: []
      - {}
      responses:
        '200':
          description: Sign-in successful, token returned.
        '400':
          description: Invalid credentials or user not found.
        '401':
          description: Password verification failed.
        '500':
          description: Clerk SDK error or other internal server error.
  /api/chats/:
    get:
      operationId: chats_list
      tags:
      - chats
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
          description: ''
    post:
      operationId: chats_create
      tags:
      - chats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
        required: true
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
          description: ''
  /api/chats/{id}/:
    get:
      operationId: chats_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chats
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetail'
          description: ''
    put:
      operationId: chats_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatDetailRequest'
        required: true
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetail'
          description: ''
    patch:
      operationId: chats_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChatDetailRequest'
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetail'
          description: ''
    delete:
      operationId: chats_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chats
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '204':
          description: No response body
  /api/chats/{id}/messages/:
    post:
      operationId: chats_messages_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatMessageRequest'
        required: true
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: ''
  /api/graph_lang/:
    get:
      operationId: graph_lang_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - graph_lang
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGraphList'
          description: ''
    post:
      operationId: graph_lang_create
      tags:
      - graph_lang
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphRequest'
        required: true
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
          description: ''
  /api/graph_lang/{id}/:
    get:
      operationId: graph_lang_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - graph_lang
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
          description: ''
    put:
      operationId: graph_lang_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - graph_lang
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphUpdateRequest'
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
          description: ''
    patch:
      operationId: graph_lang_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - graph_lang
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGraphUpdateRequest'
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
          description: ''
    delete:
      operationId: graph_lang_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - graph_lang
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '204':
          description: No response body
  /api/graph_lang/{id}/results/:
    get:
      operationId: graph_lang_results_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - graph_lang
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGraphEffectList'
          description: ''
  /api/graph_lang/{id}/run/:
    post:
      operationId: graph_lang_run_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - graph_lang
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunGraphRequest'
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunGraphResult'
          description: ''
  /api/instruments/:
    get:
      operationId: instruments_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: watched
        schema:
          type: boolean
      tags:
      - instruments
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstrumentListList'
          description: ''
  /api/instruments/detail/:
    get:
      operationId: instruments_detail_retrieve
      description: 'Retrieve an instrument by one of the following query parameters:
        id, ticker, cik, composite_figi, or share_class_figi. Provide exactly one
        of these fields.'
      parameters:
      - in: query
        name: cik
        schema:
          type: string
        description: Filter by cik.
      - in: query
        name: composite_figi
        schema:
          type: string
        description: Filter by composite_figi.
      - in: query
        name: id
        schema:
          type: string
        description: Filter by id.
      - in: query
        name: share_class_figi
        schema:
          type: string
        description: Filter by share_class_figi.
      - in: query
        name: ticker
        schema:
          type: string
        description: Filter by ticker.
      tags:
      - instruments
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentRetrieve'
          description: ''
  /api/instruments/tickers/:
    get:
      operationId: instruments_tickers_retrieve
      description: Retrieve all tickers as an object with a list of strings.
      tags:
      - instruments
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllTickers'
          description: ''
  /api/instruments/with-prices/:
    get:
      operationId: instruments_with_prices_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: watched
        schema:
          type: boolean
      tags:
      - instruments
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstrumentWithPriceList'
          description: ''
  /api/investors/{clerk_id}/:
    get:
      operationId: investors_retrieve
      parameters:
      - in: path
        name: clerk_id
        schema:
          type: string
        required: true
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investor'
          description: ''
    patch:
      operationId: investors_partial_update
      parameters:
      - in: path
        name: clerk_id
        schema:
          type: string
        required: true
      tags:
      - investors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInvestorRequest'
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investor'
          description: ''
  /api/investors/deposit/:
    post:
      operationId: investors_deposit_create
      tags:
      - investors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositMoneyRequest'
        required: true
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositMoney'
          description: ''
  /api/investors/deposit-history/:
    get:
      operationId: investors_deposit_history_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepositHistoryList'
          description: ''
  /api/investors/me/:
    get:
      operationId: investors_me_retrieve
      description: Get the investor profile for the currently authenticated user.
      summary: Get current investor
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investor'
          description: ''
    patch:
      operationId: investors_me_partial_update
      description: Update the investor profile for the currently authenticated user.
      summary: Update current investor
      tags:
      - investors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInvestorRequest'
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investor'
          description: ''
  /api/investors/me/account-value/:
    get:
      operationId: investors_me_account_value_retrieve
      description: Get account value over time data for the currently authenticated
        user.
      summary: Get account value over time
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountValueOverTimeResponse'
          description: ''
  /api/investors/me/notifications/:
    get:
      operationId: investors_me_notifications_list
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationHistory'
          description: ''
  /api/investors/me/watched-tickers/:
    get:
      operationId: investors_me_watched_tickers_list
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchedTicker'
          description: ''
  /api/investors/me/watched-tickers/{instrument_id}/:
    patch:
      operationId: investors_me_watched_tickers_partial_update
      parameters:
      - in: path
        name: instrument_id
        schema:
          type: string
        required: true
      tags:
      - investors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWatchedTickersTickerRequest'
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchedTickersTicker'
          description: ''
  /api/markets/holidays/:
    get:
      operationId: markets_holidays_list
      description: Retrieve a list of upcoming market holidays.
      tags:
      - markets
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketHoliday'
          description: ''
  /api/markets/status/:
    get:
      operationId: markets_status_retrieve
      description: Retrieve the current trading status of the markets and exchanges.
      tags:
      - markets
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketStatus'
          description: ''
  /api/news/:
    get:
      operationId: news_list
      description: Retrieve a list of 30 news articles.
      parameters:
      - in: query
        name: number_of_news
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
      - in: query
        name: order
        schema:
          enum:
          - asc
          - desc
          type: string
          default: desc
          minLength: 1
        description: |-
          * `asc` - asc
          * `desc` - desc
      - in: query
        name: published_utc
        schema:
          type: string
          format: date-time
      - in: query
        name: published_utc_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: published_utc_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: sort
        schema:
          type: string
          minLength: 1
          default: published_utc
      - in: query
        name: ticker
        schema:
          type: string
      tags:
      - news
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TickerNews'
          description: ''
  /api/notifications/vapid-public-key/:
    get:
      operationId: notifications_vapid_public_key_retrieve
      tags:
      - notifications
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidPublicKey'
          description: ''
  /api/orders/:
    get:
      operationId: orders_list
      parameters:
      - in: query
        name: ticker
        schema:
          type: string
          minLength: 1
          maxLength: 20
        description: Filter orders by instrument ticker (e.g., 'AAPL'). If not provided,
          returns orders for all instruments.
      tags:
      - orders
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/cancel/{id}/:
    delete:
      operationId: orders_cancel_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '204':
          description: No response body
  /api/orders/limit/:
    get:
      operationId: orders_limit_list
      parameters:
      - in: query
        name: ticker
        schema:
          type: string
          minLength: 1
          maxLength: 20
        description: Filter orders by instrument ticker (e.g., 'AAPL'). If not provided,
          returns orders for all instruments.
      tags:
      - orders
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LimitOrder'
          description: ''
    post:
      operationId: orders_limit_create
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLimitOrderRequest'
        required: true
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitOrder'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreationError'
          description: ''
  /api/orders/market/:
    get:
      operationId: orders_market_list
      parameters:
      - in: query
        name: ticker
        schema:
          type: string
          minLength: 1
          maxLength: 20
        description: Filter orders by instrument ticker (e.g., 'AAPL'). If not provided,
          returns orders for all instruments.
      tags:
      - orders
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketOrder'
          description: ''
    post:
      operationId: orders_market_create
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMarketOrderRequest'
        required: true
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOrder'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreationError'
          description: ''
  /api/prices/:
    get:
      operationId: prices_list
      parameters:
      - in: query
        name: tickers
        schema:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 50
        description: List of ticker symbols to fetch prices for (max 50).
        required: true
      tags:
      - prices
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceDailySummary'
          description: ''
  /api/prices/{ticker}/:
    get:
      operationId: prices_retrieve
      parameters:
      - in: path
        name: ticker
        schema:
          type: string
        required: true
      tags:
      - prices
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDailySummary'
          description: ''
  /api/prices/bars/:
    get:
      operationId: prices_bars
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
          default: '2025-09-23T00:00:00Z'
      - in: query
        name: interval
        schema:
          enum:
          - SECOND
          - MINUTE
          - HOUR
          - DAY
          - WEEK
          - MONTH
          - QUARTER
          - YEAR
          type: string
          minLength: 1
        description: |-
          * `SECOND` - SECOND
          * `MINUTE` - MINUTE
          * `HOUR` - HOUR
          * `DAY` - DAY
          * `WEEK` - WEEK
          * `MONTH` - MONTH
          * `QUARTER` - QUARTER
          * `YEAR` - YEAR
        required: true
      - in: query
        name: interval_multiplier
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: ticker
        schema:
          type: string
          minLength: 1
          maxLength: 6
        required: true
      tags:
      - prices
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
