x-backend-common: &backend-common
  image: investlab-backend:latest
  build:
    context: ./src
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./src:/app:delegated
    - /app/.venv
  networks:
    - app_network

services:
  postgres:
    image: postgres:17
    env_file: .env
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    profiles:
      - default
      - ci

  redis:
    image: redis:8.2
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - app_network
    profiles:
      - default
      - ci

  celery:
    <<: *backend-common
    command: ["uv", "run", "celery", "-A", "config", "worker", "-l", "info"]
    healthcheck:
      test: ["CMD", "uv", "run", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    profiles:
      - default

  celery-beat:
    <<: *backend-common
    command: ["uv", "run", "celery", "-A", "config", "beat", "-l", "info"]
    healthcheck:
      test: ["CMD", "uv", "run", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    profiles:
      - default

  migrate:
    <<: *backend-common
    command: ["uv", "run", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - default
      - ci

  backend:
    <<: *backend-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    profiles:
      - default
      - ci

  backend-price-stream:
    <<: *backend-common
    command: ["uv", "run", "manage.py", "mock_stream_prices"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - DJANGO_LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "/bin/true"]
      interval: 10s
      timeout: 10s
      retries: 3
    profiles:
      - default

  backend-price-notifier:
    <<: *backend-common
    command: ["uv", "run", "manage.py", "notify_prices"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/true"]
      interval: 10s
      timeout: 10s
      retries: 3
    profiles:
      - default

  backend-order-engine:
    <<: *backend-common
    command: ["uv", "run", "manage.py", "run_order_engine"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/true"]
      interval: 10s
      timeout: 10s
      retries: 3
    profiles:
      - default

  mcp-massive:
    image: ghcr.io/astral-sh/uv:debian
    command:
      [
        "uvx",
        "--from",
        "git+https://github.com/investlab-app/mcp_massive",
        "mcp_massive",
      ]
    env_file: .env
    restart: unless-stopped
    ports:
      - "8050:8000"
    environment:
      - MASSIVE_API_KEY=${POLYGON_SECRET_KEY}
      - MCP_TRANSPORT=streamable-http
      - MASSIVE_MCP_HOST=0.0.0.0
    networks:
      - app_network
    profiles:
      - default

  mcp-echarts:
    image: node:22-slim
    command: ["npx", "-y", "mcp-echarts", "-t", "streamable", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8051:8000"
    networks:
      - app_network
    environment:
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-true}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_ECHARTS_MCP_BUCKET_NAME}
    profiles:
      - default

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - app_network
    profiles:
      - default
      - ci

  init-minio:
    image: alpine:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_STATIC_BUCKET_NAME: ${MINIO_STATIC_BUCKET_NAME}
      MINIO_MEDIA_BUCKET_NAME: ${MINIO_MEDIA_BUCKET_NAME}
      MINIO_ECHARTS_MCP_BUCKET_NAME: ${MINIO_ECHARTS_MCP_BUCKET_NAME}
    command: sh -c "
      apk add --no-cache curl &&
      curl -s https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc &&
      chmod +x /usr/local/bin/mc &&
      mc alias set minio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb minio/${MINIO_STATIC_BUCKET_NAME} || true &&
      mc mb minio/${MINIO_MEDIA_BUCKET_NAME} || true &&
      mc mb minio/${MINIO_ECHARTS_MCP_BUCKET_NAME} || true &&
      mc anonymous set download minio/${MINIO_STATIC_BUCKET_NAME} || true &&
      mc anonymous set download minio/${MINIO_MEDIA_BUCKET_NAME} || true &&
      mc anonymous set download minio/${MINIO_ECHARTS_MCP_BUCKET_NAME} || true
      "
    networks:
      - app_network
    profiles:
      - default
      - ci

volumes:
  postgres_data:
  minio_data:

networks:
  app_network:
    driver: bridge
