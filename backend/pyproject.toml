[tool.isort]
profile = "black"
skip = [
    "manage.py",
    "migrations",
    "export",
    "media",
    "requirements.txt",
    "venv",
    ".venv",
    ".mypy_cache",
]

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    manage.py
|   migrations
|   export
|   media
|   requirements.txt
|   venv
|   .git
|   .venv
|   .mypy_cache
)/
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=modules --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "*/management/*",
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    # */apps.py",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]


[[tool.mypy.overrides]]
module = ["unfold.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pylint]
disable = [
    "R0903", # too-few-public-methods
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0415", # import-outside-toplevel
    "C0301", # line-too-long
]
ignore = ["migrations"]
load-plugins = ["pylint_pytest"]

[tool.pylint."**/tests/**/*"]
disable = [
    "C0116", # missing-function-docstring
    "W0611", # unused-import
]
