[project]
name = "stocks-backend"
version = "0.1.0"
description = "Stocks Backend"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2.3",
    "djangorestframework>=3.16.0",
    "djangorestframework-simplejwt>=5.5.0",
    "drf-spectacular>=0.28.0",
    "channels>=4.2.2",
    "django-cors-headers>=4.7.0",
    "django-unfold>=0.59.0",
    "yfinance>=0.2.63",
    "pandas>=2.3.0",
    "whitenoise>=6.9.0",
    "pydantic>=2.11.6",
    "clerk-backend-api @ git+https://github.com/mikolajkapica/clerk-sdk-python.git@43b124a61199d974b24a5955073ce72d529d7bc7",
    "psycopg>=3.2.9",
    "uvicorn>=0.34.3",
    "jwcrypto>=1.5.6",
]

[project.optional-dependencies]
dev = [
    "uv>=0.7.13",
    "daphne>=4.2.0",
    "pytest>=8.4.0",
    "pytest-django>=4.11.1",
    "pytest-cov>=6.2.1",
    "mypy>=1.16.0",
    "django-stubs>=5.2.0",
    "djangorestframework-stubs>=3.16.0",
    "ruff>=0.11.13",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.1",
    "pandas-stubs>=2.2.3.250527",
    "types-jwcrypto>=1.5.0.20250516",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=modules --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = [
    "*/management/*",
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "manage.py",
    "migrations",
    "export",
    "media",
    "requirements.txt",
    "venv",
    ".venv",
    ".mypy_cache",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",     # docstring issues
    "ANN",   # type annotation issues
    "ARG",   # argument issues
    "BLE",   # blind exception issues
    "COM812", # missing-trailing-comma issues
    "DTZ",   # datetime issues
    "EM",    # exception message issues
    "INP",   # implicit namespace package issues
    "PGH",   # type ignore issues
    "PLR",   # magic number issues
    "RET",   # return issues
    "RUF",   # ruff specific issues
    "S",     # security issues
    "TRY",   # try/except issues
    "T",     # print issues
    "N818",  # exception naming issues
    "DJ001", # Django specific issues
    "ERA001", # commented out code
    "EXE",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "D",      # docstring issues
    "ANN",    # type annotation issues
    "ARG",    # argument issues
    "BLE",    # blind exception issues
    "DTZ",    # datetime issues
    "EM",     # exception message issues
    "INP",    # implicit namespace package issues
    "PGH",    # type ignore issues
    "PLR",    # magic number issues
    "RET",    # return issues
    "RUF",    # ruff specific issues
    "S",      # security issues
    "TRY",    # try/except issues
    "T",      # print issues
    "SLF001", # self reference issues
    "F",     # pyflakes issues
    "PT",    # pytest issues
]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "unfold.*", "channels.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "config",
    "modules",
    "modules.prices",
    "modules.sse",
    "modules.instruments",
    "modules.authentication",
    "modules.core",
    "modules.users",
    "modules.transactions",
    "modules.orders",
    "modules.investors"
]
