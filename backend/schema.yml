openapi: 3.0.3
info:
  title: Stocks API
  version: 0.0.1
  description: API for stock market data and trading operations
paths:
  /api/auth/sign-in/:
    post:
      operationId: auth_sign_in_create
      description: Authenticates a user using their email and password through Clerk,
        returning a sign-in token upon success.
      summary: Sign in a user with email and password via Clerk
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClerkLoginRequest'
        required: true
      security:
      - ClerkAuth: []
      - {}
      responses:
        '200':
          description: Sign-in successful, token returned.
        '400':
          description: Invalid credentials or user not found.
        '401':
          description: Password verification failed.
        '500':
          description: Clerk SDK error or other internal server error.
  /api/instruments/:
    get:
      operationId: instruments_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - instruments
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstrumentListList'
          description: ''
  /api/instruments/detail/:
    get:
      operationId: instruments_detail_retrieve
      description: 'Retrieve an instrument by one of the following query parameters:
        id, ticker, cik, composite_figi, or share_class_figi. Provide exactly one
        of these fields.'
      parameters:
      - in: query
        name: cik
        schema:
          type: string
        description: Filter by cik.
      - in: query
        name: composite_figi
        schema:
          type: string
        description: Filter by composite_figi.
      - in: query
        name: id
        schema:
          type: string
        description: Filter by id.
      - in: query
        name: share_class_figi
        schema:
          type: string
        description: Filter by share_class_figi.
      - in: query
        name: ticker
        schema:
          type: string
        description: Filter by ticker.
      tags:
      - instruments
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentRetrieve'
          description: ''
  /api/instruments/with-prices/:
    get:
      operationId: instruments_with_prices_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - instruments
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstrumentWithPriceList'
          description: ''
  /api/investors/:
    get:
      operationId: investors_list
      description: Get a paginated list of investors with optional search filtering.
      summary: List investors
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number for pagination.
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
        description: Number of items per page (max 100).
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvestorList'
          description: ''
  /api/investors/{clerk_id}/:
    get:
      operationId: investors_retrieve
      description: Retrieve a specific investor by ID.
      summary: Get investor
      parameters:
      - in: path
        name: clerk_id
        schema:
          type: string
        required: true
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investor'
          description: ''
    put:
      operationId: investors_update
      description: Update an investor's information.
      summary: Update investor
      parameters:
      - in: path
        name: clerk_id
        schema:
          type: string
        required: true
      tags:
      - investors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestorUpdateRequest'
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investor'
          description: ''
    patch:
      operationId: investors_partial_update
      description: Partially update an investor's information.
      summary: Partially update investor
      parameters:
      - in: path
        name: clerk_id
        schema:
          type: string
        required: true
      tags:
      - investors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInvestorUpdateRequest'
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investor'
          description: ''
  /api/investors/me/:
    get:
      operationId: investors_me_retrieve
      description: Get the investor profile for the currently authenticated user.
      summary: Get current investor
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investor'
          description: ''
  /api/investors/me/account-value/:
    get:
      operationId: investors_me_account_value_list
      description: Get account value over time data for the currently authenticated
        user.
      summary: Get account value over time
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountValueSnapshotDaily'
          description: ''
  /api/investors/me/asset-allocation/:
    get:
      operationId: investors_me_asset_allocation_retrieve
      description: Get asset allocation data for the currently authenticated user.
      summary: Get asset allocation
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAllocation'
          description: ''
  /api/investors/me/current-account-value/:
    get:
      operationId: investors_me_current_account_value_retrieve
      description: Get the current account value as well as gain and percent gain
        for the authenticated user.
      summary: Get current account value
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccountValue'
          description: ''
  /api/investors/me/owned-shares/:
    get:
      operationId: investors_me_owned_shares_retrieve
      description: Get owned shares data for the currently authenticated user.
      summary: Get owned shares
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedShare'
          description: ''
  /api/investors/me/statistics/most-traded/:
    get:
      operationId: investors_me_statistics_most_traded_list
      description: Returns number of trades, number of buys/sells, avg gain/loss,
        and total return from the most frequently traded instruments.
      summary: Get overview about the most traded instruments
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMostTradedItemList'
          description: ''
  /api/investors/me/statistics/trading-overview/:
    get:
      operationId: investors_me_statistics_trading_overview_retrieve
      description: Returns total trades, number of buys/sells, average gain/loss,
        and total return for the current investor.
      summary: Get trading performance overview
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingOverview'
          description: ''
  /api/investors/me/stats/:
    get:
      operationId: investors_me_stats_retrieve
      description: Get investor statistics for the currently authenticated user.
      summary: Get investor stats
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestorStats'
          description: ''
  /api/investors/me/transactions-history/:
    get:
      operationId: investors_me_transactions_history_list
      description: Get transaction history for the currently authenticated user. Can
        filter by position type (open/closed/both) and ticker symbol.
      summary: Get transaction history
      parameters:
      - in: query
        name: ticker
        schema:
          type: string
          minLength: 1
          maxLength: 10
        description: Filter by specific ticker symbol
      - in: query
        name: type
        schema:
          enum:
          - open
          - closed
          - both
          type: string
          default: both
          minLength: 1
        description: |-
          Type of positions to fetch: 'open', 'closed', or 'both'

          * `open` - open
          * `closed` - closed
          * `both` - both
      tags:
      - investors
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
          description: ''
  /api/markets/holidays/:
    get:
      operationId: markets_holidays_list
      description: Retrieve a list of upcoming market holidays.
      tags:
      - markets
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketHoliday'
          description: ''
  /api/markets/status/:
    get:
      operationId: markets_status_retrieve
      description: Retrieve the current trading status of the markets and exchanges.
      tags:
      - markets
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketStatus'
          description: ''
  /api/news/:
    get:
      operationId: news_list
      description: Retrieve a list of 30 news articles.
      parameters:
      - in: query
        name: number_of_news
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
      - in: query
        name: order
        schema:
          enum:
          - asc
          - desc
          type: string
          default: desc
          minLength: 1
        description: |-
          * `asc` - asc
          * `desc` - desc
      - in: query
        name: published_utc
        schema:
          type: string
          format: date-time
      - in: query
        name: published_utc_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: published_utc_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: sort
        schema:
          type: string
          minLength: 1
          default: published_utc
      - in: query
        name: ticker
        schema:
          type: string
      tags:
      - news
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TickerNews'
          description: ''
  /api/orders/:
    get:
      operationId: orders_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - orders
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
  /api/orders/cancel/{id}:
    delete:
      operationId: orders_cancel_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '204':
          description: No response body
  /api/orders/market/:
    post:
      operationId: orders_market_create
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMarketOrderRequest'
        required: true
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMarketOrder'
          description: ''
  /api/prices/:
    get:
      operationId: prices_list
      parameters:
      - in: query
        name: tickers
        schema:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 50
        description: List of ticker symbols to fetch prices for (max 50).
        required: true
      tags:
      - prices
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDailySummary'
          description: ''
  /api/prices/{ticker}/:
    get:
      operationId: prices_retrieve
      parameters:
      - in: path
        name: ticker
        schema:
          type: string
        required: true
      tags:
      - prices
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceDailySummary'
          description: ''
  /api/prices/bars/:
    get:
      operationId: prices_bars
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
          default: '2025-09-23T00:00:00Z'
      - in: query
        name: interval
        schema:
          enum:
          - SECOND
          - MINUTE
          - HOUR
          - DAY
          - WEEK
          - MONTH
          - QUARTER
          - YEAR
          type: string
          minLength: 1
        description: |-
          * `SECOND` - SECOND
          * `MINUTE` - MINUTE
          * `HOUR` - HOUR
          * `DAY` - DAY
          * `WEEK` - WEEK
          * `MONTH` - MONTH
          * `QUARTER` - QUARTER
          * `YEAR` - YEAR
        required: true
      - in: query
        name: interval_multiplier
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: ticker
        schema:
          type: string
          minLength: 1
          maxLength: 6
        required: true
      tags:
      - prices
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceBar'
          description: ''
  /api/status/:
    get:
      operationId: status_retrieve
      description: Returns a simple status message indicating the application is running.
      summary: Get application status
      tags:
      - status
      security:
      - ClerkAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
          description: Application status
  /api/test/admin_test/:
    get:
      operationId: test_admin_test_retrieve
      description: Test endpoint to verify admin authentication is working.
      summary: Test admin authentication
      tags:
      - test
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTestResponse'
          description: Admin authentication test successful
  /api/test/all_test/:
    get:
      operationId: test_all_test_retrieve
      description: Test endpoint that doesn't require authentication.
      summary: Test unauthenticated endpoint
      tags:
      - test
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
          description: Unauthenticated test successful
  /api/test/alpaca_test/:
    get:
      operationId: test_alpaca_test_retrieve
      description: test alpaca.
      summary: Fetch last trade from Alpaca
      tags:
      - test
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
          description: Last trade result from Alpaca
  /api/test/polygon_test/:
    get:
      operationId: test_polygon_test_retrieve
      description: test polygon.
      summary: Fetch last trade from Polygon.io
      tags:
      - test
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
          description: Last trade result from Polygon
  /api/test/users_test/:
    get:
      operationId: test_users_test_retrieve
      description: Test endpoint to verify user authentication is working.
      summary: Test user authentication
      tags:
      - test
      security:
      - ClerkAuth: []
      - ClerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTestResponse'
          description: Authentication test successful
components:
  schemas:
    AccountValueSnapshotDaily:
      type: object
      description: Serializer for AccountValueSnapshot model.
      properties:
        date:
          type: string
          format: date
          readOnly: true
          description: Date of the value measurement
        value:
          type: number
          format: double
          description: Account value on this date
      required:
      - date
      - value
    AssetAllocation:
      type: object
      properties:
        total_value:
          type: number
          format: double
        total_return_this_year:
          type: number
          format: double
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AssetAllocationItem'
      required:
      - allocations
      - total_return_this_year
      - total_value
    AssetAllocationItem:
      type: object
      properties:
        instrument_name:
          type: string
          maxLength: 255
        instrument_ticker:
          type: string
          maxLength: 20
        instrument_logo:
          type: string
          format: uri
          nullable: true
        instrument_icon:
          type: string
          format: uri
          nullable: true
        value:
          type: number
          format: double
        percentage:
          type: number
          format: double
      required:
      - instrument_icon
      - instrument_logo
      - instrument_name
      - instrument_ticker
      - percentage
      - value
    AuthTestResponse:
      type: object
      description: Serializer for authentication test response
      properties:
        message:
          type: string
          description: Authentication success message
        user_role:
          type: string
          description: Role of the authenticated user
        user_id:
          type: integer
          description: ID of the authenticated user
      required:
      - message
      - user_id
      - user_role
    ClerkLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    CreateMarketOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        investor:
          type: string
          format: uuid
          readOnly: true
      required:
      - id
      - investor
    CreateMarketOrderRequest:
      type: object
      properties:
        ticker:
          type: string
          writeOnly: true
          minLength: 1
        volume:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          writeOnly: true
        is_buy:
          type: boolean
          writeOnly: true
      required:
      - is_buy
      - ticker
      - volume
    CurrentAccountValue:
      type: object
      properties:
        total_account_value:
          type: number
          format: double
        gain:
          type: number
          format: double
        gain_percent:
          type: number
          format: double
      required:
      - gain
      - gain_percent
      - total_account_value
    HistoryEntry:
      type: object
      properties:
        date:
          type: string
          format: date-time
          description: Date of the transaction
        type:
          type: string
          description: 'Transaction type: BUY or SELL'
          maxLength: 10
        quantity:
          type: integer
          description: Number of shares traded
        share_price:
          type: number
          format: double
          description: Price per share at the time of transaction
        acquisition_price:
          type: number
          format: double
          nullable: true
          description: Acquisition price (null for SELL transactions)
        market_value:
          type: number
          format: double
          description: Current market value
        gain_loss:
          type: number
          format: double
          description: Gain or loss amount
        gain_loss_pct:
          type: number
          format: double
          description: Gain or loss percentage
      required:
      - acquisition_price
      - date
      - gain_loss
      - gain_loss_pct
      - market_value
      - quantity
      - share_price
      - type
    Insight:
      type: object
      properties:
        sentiment:
          type: string
          nullable: true
        sentiment_reasoning:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
    InstrumentList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticker:
          type: string
          title: Ticker Symbol
          maxLength: 20
        type:
          type: string
          nullable: true
          description: Security type, e.g. 'CS' (Common Stock), 'ETF', 'Crypto'.
          maxLength: 50
        active:
          type: boolean
          description: Indicates whether the ticker is actively traded.
        name:
          type: string
          maxLength: 255
        market:
          $ref: '#/components/schemas/MarketEnum'
        market_cap:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          nullable: true
        currency_name:
          type: string
          maxLength: 50
        icon:
          type: string
          format: uri
          nullable: true
        logo:
          type: string
          format: uri
          nullable: true
      required:
      - active
      - currency_name
